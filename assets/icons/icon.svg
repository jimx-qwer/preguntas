<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  <!-- Academic Hat & Research Book Icon -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Mortarboard cap top -->
    <polygon points="256,120 408,180 256,240 104,180" />
    <!-- Cap skull base -->
    <path d="M164,210 L164,270 Q256,320 348,270 L348,210 Q256,252 164,210 Z" />
