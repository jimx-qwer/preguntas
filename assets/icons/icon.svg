    <circle cx="400" cy="295" r="7" fill="#fef08a"/>
    <!-- Open Book / Pages below -->
    <path d="M128,340 Q256,310 256,350 Q256,310 384,340 L384,410 Q256,380 256,420 Q256,380 128,410 Z" fill="#f8fafc"/>
    <line x1="256" y1="350" x2="256" y2="420" stroke="#cbd5e1" stroke-width="4"/>
